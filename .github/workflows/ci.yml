name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:   # permet de lancer le déploiement manuellement

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Calcul du nom d'image
        id: vars
        run: |
          IMAGE=$(echo "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA::7}" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.vars.outputs.image }}

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'   # déploiement manuel
    runs-on: ubuntu-latest
    environment: production   # vous pouvez exiger une approbation dans les settings
    steps:
      - uses: actions/checkout@v4

      - name: Configuration SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SWARM_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SWARM_HOST }}" >> ~/.ssh/known_hosts

      - name: Copie du docker-compose
        run: scp docker-compose.yml ${{ secrets.SWARM_USER }}@${{ secrets.SWARM_HOST }}:~/docker-compose.yml

      - name: Déploiement sur Swarm
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh ${{ secrets.SWARM_USER }}@${{ secrets.SWARM_HOST }} "
            echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin &&
            IMAGE='$IMAGE' docker stack deploy -c docker-compose.yml ma_stack --with-registry-auth
          "
