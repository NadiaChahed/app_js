
name: Build and Deploy to Kubernetes

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.vars.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image name
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t "${{ steps.vars.outputs.image }}" .

      - name: Push Docker image
        run: docker push "${{ steps.vars.outputs.image }}"

  deploy:
    name: Deploy to Kubernetes
    runs-on: self-hosted

    needs: build

    environment:
      name: production

    env:
      IMAGE: ${{ needs.build.outputs.image }}
      APP_VERSION: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl and gettext
        run: |
          if ! command -v kubectl >/dev/null 2>&1; then
            echo "kubectl doit être installé sur le runner."
            exit 1
          fi
          if ! command -v envsubst >/dev/null 2>&1; then
            echo "envsubst doit être installé sur le runner."
            exit 1
          fi

      - name: Check Kubernetes connection
        run: kubectl get nodes

      - name: Apply namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Create registry secret
        env:
          REGISTRY_DEPLOY_USER: ${{ secrets.REGISTRY_DEPLOY_USER }}
          REGISTRY_DEPLOY_TOKEN: ${{ secrets.REGISTRY_DEPLOY_TOKEN }}
        run: |
          kubectl create secret docker-registry gitlab-registry \
            --docker-server=ghcr.io \
            --docker-username="$REGISTRY_DEPLOY_USER" \
            --docker-password="$REGISTRY_DEPLOY_TOKEN" \
            -n demo \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy application
        run: |
          envsubst '${IMAGE} ${APP_VERSION}' \
            < k8s/deployment.yaml | kubectl apply -f -

      - name: Apply service
        run: kubectl apply -f k8s/service.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/web -n demo --timeout=120s
