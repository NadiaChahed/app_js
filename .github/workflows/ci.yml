```yaml
name: Docker Swarm CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Build and push Docker image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  deploy_swarm:
    runs-on: ubuntu-latest
    needs: build_image
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SWARM_SSH_KEY: ${{ secrets.SWARM_SSH_KEY }}
          SWARM_HOST: ${{ secrets.SWARM_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SWARM_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SWARM_HOST" >> ~/.ssh/known_hosts

      - name: Copy Compose file
        env:
          SWARM_HOST: ${{ secrets.SWARM_HOST }}
          SWARM_USER: ${{ secrets.SWARM_USER }}
        run: |
          scp docker-compose.yml \
            "$SWARM_USER@$SWARM_HOST:~/docker-compose.yml"

      - name: Deploy to Docker Swarm
        env:
          SWARM_HOST: ${{ secrets.SWARM_HOST }}
          SWARM_USER: ${{ secrets.SWARM_USER }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          ssh "$SWARM_USER@$SWARM_HOST" \
            "IMAGE='$IMAGE' docker stack deploy \
            -c docker-compose.yml ma_stack"
```
