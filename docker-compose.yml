version: "3.8"

services:
  web:
    image: ${IMAGE}
    environment:
      - APP_VERSION=${CI_COMMIT_SHORT_SHA}
    ports:
      - "8080:3000"
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
      restart_policy:
        condition: on-failure
